# Test configuration with demo subset for quick validation
dataset: scifact
data_dir: datasets

# Embedding model for retrieval
model_name: sentence-transformers/all-MiniLM-L6-v2

# Reranking - enabled
rerank: true
rerank_model: cross-encoder/ms-marco-MiniLM-L-6-v2
rerank_k: 5

# LLM for generation
llm_model: gpt-4o-mini
llm_temperature: 0.0

# Smaller top_k for testing
top_k: 10

# Demo subset - only process 3 queries
demo_subset: 3

# Output directory
output_dir: outputs/test
