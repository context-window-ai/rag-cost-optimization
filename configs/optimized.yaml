# Optimized RAG pipeline configuration
# This is the "after" in the before/after comparison - cheaper/faster than naive baseline
#
# OPTIMIZATION LEVERS (all toggleable):
#
# 1. lower_top_k: Reduce retrieval candidates from 100 to 10
#    - Faster retrieval, fewer documents to process
#    - Impact: ~10x fewer candidates, lower latency
#
# 2. conditional_rerank: skip reranking when retrieval confidence is high
#    - When top retrieval score >= rerank_skip_threshold, skip CrossEncoder
#    - Impact: Avoid expensive reranking for easy queries
#
# 3. model_routing: use cheaper model for straightforward queries
#    - When top score >= cheap_model_threshold, use gpt-4o-mini instead of gpt-4o
#    - Impact: ~17x cheaper generation for high-confidence queries

dataset: scifact
data_dir: datasets

# Embedding model for retrieval (same as naive)
embedding_model: sentence-transformers/all-MiniLM-L6-v2

# Reranking settings
rerank: true
rerank_model: cross-encoder/ms-marco-MiniLM-L-6-v2
rerank_k: 10

# LLM settings - primary model (expensive, for complex queries)
llm_model: openai/gpt-5.4-mini
llm_temperature: 0.0

# OPTIMIZATION LEVER 1: Lower top_k (10 vs naive 100)
top_k: 10

# OPTIMIZATION LEVER 2: Conditional reranking
# Skip reranking when top retrieval score is high (confident retrieval)
conditional_rerank: true
rerank_skip_threshold: 0.85

# OPTIMIZATION LEVER 3: Model routing
# Use cheaper model for high-confidence queries
model_routing: true
cheap_model: openai/gpt-5.4-mini
cheap_model_threshold: 0.80

# Demo subset - set to an integer to limit queries, or null for full dataset
demo_subset: null

# Output directory
output_dir: outputs/optimized
