# Step 4: Conditional reranking
# top_k=10, conditional rerank, model=openai/gpt-5.4-mini, no routing

dataset: scifact
data_dir: datasets

# Embedding model for retrieval
embedding_model: sentence-transformers/all-MiniLM-L6-v2

# Reranking settings
rerank: true
rerank_model: cross-encoder/ms-marco-MiniLM-L-6-v2
rerank_k: 10

# LLM for generation
llm_model: openai/gpt-5.4-mini
llm_temperature: 0.0

# Lower top_k for retrieval
top_k: 10

# Conditional reranking - skip when retrieval confidence is high
conditional_rerank: true
rerank_skip_threshold: 0.85

# Output directory
output_dir: outputs/ladder/step4_cond_rerank
