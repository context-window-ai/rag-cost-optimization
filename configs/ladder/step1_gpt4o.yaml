# Step 1: Expensive baseline with GPT-4o
# top_k=100, always rerank, model=openai/gpt-4o, no routing

dataset: scifact
data_dir: datasets

# Embedding model for retrieval
embedding_model: sentence-transformers/all-MiniLM-L6-v2

# Reranking - always enabled
rerank: true
rerank_model: cross-encoder/ms-marco-MiniLM-L-6-v2
rerank_k: 10

# LLM for generation (expensive GPT-4o model)
llm_model: openai/gpt-4o
llm_temperature: 0.0

# High top_k for retrieval (expensive)
top_k: 100

# Output directory
output_dir: outputs/ladder/step1_gpt4o
