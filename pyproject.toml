[project]
name = "rag-cost-optimization"
version = "0.1.0"
description = "Compare RAG outcomes against cost"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beir>=2.0.0",
    "faiss-cpu>=1.7.4",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "pandas>=2.0.0",
    "openai>=1.0.0",
    "tiktoken>=0.5.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_retrieval"]
